<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lucasopoka.com</title>

    <!--
      Inlined so it paints before styles.css fetches, incl. inside the
      per-view WebVM <iframe> (see WebVmEmbed/WebVmFrame). __TOKEN__s are
      filled in at build time from src/webvm/terminalLayout.ts (vite.config.ts).
    -->
    <style>
      body {
        margin: 0;
        background: var(--page-bg, __PAGE_BACKGROUND__);
      }
    </style>
    <script>
      if (location.pathname === '/webvm-frame') {
        document.documentElement.style.setProperty(
          '--page-bg',
          'linear-gradient(to bottom, __TERMINAL_BLACK__ 0, __TERMINAL_BLACK__ __TERMINAL_HEIGHT__px, __PAGE_BACKGROUND__ __TERMINAL_HEIGHT__px, __PAGE_BACKGROUND__ 100%)',
        )
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Micro+5&family=Micro+5+Charted&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
