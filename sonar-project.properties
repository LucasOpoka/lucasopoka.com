# Provisional — projectKey/organization confirmed once the project is actually registered on
# SonarQube Cloud (plan Phase E). Update these two lines to match what SonarCloud assigns.
sonar.projectKey=LucasOpoka_lucasopoka.com
sonar.organization=lucasopoka

sonar.sources=frontend/frontend_react/src
sonar.tests=frontend/frontend_react/src
sonar.test.inclusions=frontend/frontend_react/src/**/*.test.tsx,frontend/frontend_react/src/**/*.test.ts

# Generated/vendored — nothing to analyse. public/** also covers public/pong/pong.sh, a static
# demo content asset (not ours) that shellcheck's ci.yml job already excludes the same way.
sonar.exclusions=frontend/frontend_react/dist/**,frontend/frontend_react/node_modules/**,frontend/frontend_react/coverage/**,frontend/frontend_react/public/**

# Analysed, but not required to carry coverage (test scaffolding and config, not app logic).
sonar.coverage.exclusions=frontend/frontend_react/src/test/**,frontend/frontend_react/vite.config.ts,frontend/frontend_react/eslint.config.ts

sonar.javascript.lcov.reportPaths=frontend/frontend_react/coverage/lcov.info
