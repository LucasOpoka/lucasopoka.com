name: Scheduled image scan

# Re-scans the images actually deployed to staging and production on a fixed cadence, catching
# CVEs newly disclosed against an already-shipped, otherwise-unchanged image — cd.yml's own scan
# only runs at deploy time, so a quiet week with no deploys would otherwise go unscanned.
on:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan deployed images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
        include:
          - environment: production
            tag: main
          - environment: staging
            tag: develop
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/lucasopoka/lucasopoka.com:${{ matrix.tag }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image-results.sarif
      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-scheduled-${{ matrix.environment }}
