name: CI

on:
  pull_request:
    branches: [develop, main]
    # `labeled` is needed so attaching the `e2e` label to an already-open PR actually re-triggers
    # this workflow — by default GitHub only fires pull_request on open/sync/reopen, not labeling.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend_react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/frontend_react/.nvmrc
          cache: npm
          cache-dependency-path: frontend/frontend_react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: frontend/frontend_react/coverage/lcov.info

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend_react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/frontend_react/.nvmrc
          cache: npm
          cache-dependency-path: frontend/frontend_react/package-lock.json
      - run: npm ci
      - run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        working-directory: frontend/frontend_react
        run: npm audit --audit-level=high
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # Required before merging into main; opt-in elsewhere via the `e2e` label — it's slow (real
    # browser, real Docker image, the WebVM's real CDN/disk-image network dependencies) so it
    # doesn't run on every PR by default. status-check treats a skipped job as passing, so this
    # needs no separate branch-protection entry — being unconditional for main is what makes it
    # a real gate there.
    if: github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: false
          load: true
          tags: lucasopoka-e2e:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the app container
        run: |
          docker run -d --name e2e-app -p 8080:8080 lucasopoka-e2e:latest
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            echo "Not healthy yet (attempt $attempt/30)"
            sleep 2
          done
          echo "App container never became healthy" >&2
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/frontend_react/.nvmrc
          cache: npm
          cache-dependency-path: frontend/frontend_react/package-lock.json
      - working-directory: frontend/frontend_react
        run: npm ci
      - working-directory: frontend/frontend_react
        run: npx playwright install --with-deps chromium
      - working-directory: frontend/frontend_react
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/frontend_react/playwright-report/
          retention-days: 7
      - if: always()
        run: docker logs e2e-app || true

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # frontend/ has content assets that happen to be .sh files (e.g. the pong demo's
          # public/pong/pong.sh) — not operational scripts of ours, and not meant to be linted.
          ignore_paths: frontend

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  sonar:
    name: SonarQube Cloud
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: frontend/frontend_react/coverage
      # SONAR_TOKEN is registered as of the SonarCloud project setup — this check just keeps
      # the job from permanently failing if the secret is ever removed/rotated out.
      - name: Check SonarCloud is configured
        id: check
        run: echo "configured=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        if: steps.check.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  status-check:
    name: status-check
    if: always()
    needs:
      [quality, build, docker-build, e2e, security, hadolint, shellcheck, actionlint, sonar]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
